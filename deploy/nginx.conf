# /etc/nginx/sites-available/treino
#
# O TLS termina na borda da Cloudflare e o cloudflared entrega aqui em texto
# claro pela loopback. Por isso nao existe bloco 443 nem certbot: nada neste
# container escuta numa interface roteavel.

server {
    listen 127.0.0.1:80 default_server;
    server_name _;

    root /opt/treino/public;
    index index.html;

    # Quem chega e' sempre o cloudflared (127.0.0.1). O IP real da visitante
    # vem no cabecalho CF-Connecting-IP - sem isso o log inteiro vira 127.0.0.1.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # Compressao: o JSON do catalogo encolhe bastante
    gzip on;
    gzip_types text/css text/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Cabecalhos de seguranca. O CSP libera o embed do YouTube e nada mais.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # O index nunca fica em cache: e' o que carrega a versao nova do app.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Treinos e exercicios mudam quando voce edita - revalida sempre.
    location /data/ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
    }
}
