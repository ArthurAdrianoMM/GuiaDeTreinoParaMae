# /etc/nginx/sites-available/treino
# Depois do certbot, ele acrescenta sozinho o bloco 443 e o redirecionamento.

server {
    listen 80;
    listen [::]:80;
    server_name treino.SEU-DOMINIO.com;   # <-- trocar

    root /opt/treino/public;
    index index.html;

    # Compressao: o JSON do catalogo encolhe bastante
    gzip on;
    gzip_types text/css text/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Cabecalhos de seguranca. O CSP libera o embed do YouTube e nada mais.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # O index nunca fica em cache: e' o que carrega a versao nova do app.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Treinos e exercicios mudam quando voce edita - revalida sempre.
    location /data/ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
    }
}
